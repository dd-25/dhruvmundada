name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Next's compiler cache. Without it every run is a cold build; restoring it
      # takes the compile step from ~9s to under 1s.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'content/**') }}
          restore-keys: |
            next-${{ hashFiles('package-lock.json') }}-
            next-

      - run: npx eslint src --max-warnings=0

      # Asserts the inline markdown renderer, which points and blurbs go through.
      - run: npx tsx src/lib/content/markdown.check.mts

      # Content is validated here. A malformed file in content/ fails this step,
      # the deploy never runs, and the live site stays on the last good build.
      - run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
