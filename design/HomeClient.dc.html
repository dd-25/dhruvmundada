<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500&family=Instrument+Serif:ital@0;1&display=swap">
  <style>
    body { margin: 0; }
    * { box-sizing: border-box; }
    a { text-decoration: none; }
    .soc:hover { opacity: 1 !important; }
  </style>
</helmet>

<div style="width: 1280px; height: 800px; position: relative; overflow: hidden; font-family: 'IBM Plex Sans', system-ui, sans-serif; background-color: #faf8f4; background-image: radial-gradient(circle, #e7e2d8 1px, transparent 1px); background-size: 26px 26px;">

  <div style="position: absolute; top: 28px; right: 36px; display: flex; align-items: center; gap: 14px;">
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.09em; color: #8a94a0;">VIEWING AS</span>
    <div style="display: flex; border: 1px solid #e3ded4; border-radius: 3px; overflow: hidden;">
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.05em; padding: 7px 16px; background: #0d6156; color: #ffffff;">client</div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.05em; padding: 7px 16px; color: #8a94a0;">engineer</div>
    </div>
  </div>

  <div style="position: absolute; inset: 0 0 46px 0; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding: 0 0 0 136px;">

    <h1 style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 68px; line-height: 1.02; letter-spacing: -0.01em; color: #131b24;">Dhruv Mundada</h1>

    <p style="margin: 24px 0 0 0; max-width: 32ch; font-size: 20px; line-height: 1.55; color: #4e5b68; text-wrap: pretty;">I take products from an idea to something people pay for.</p>

    <div style="display: flex; align-items: center; gap: 26px; margin-top: 44px;">

      <a href="#" style="display: flex; align-items: center; gap: 9px; background: #0d6156; color: #ffffff; font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.02em; padding: 12px 20px; border-radius: 3px;">
        book a call
        <span style="font-size: 14px;">→</span>
      </a>

      <div style="display: flex; align-items: center; gap: 20px;">
        <a class="soc" href="#" style="display: flex; opacity: 0.5; color: #131b24; transition: opacity 180ms ease;" title="LinkedIn">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>
        </a>
        <a class="soc" href="#" style="display: flex; opacity: 0.5; color: #131b24; transition: opacity 180ms ease;" title="GitHub">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
        </a>
        <a class="soc" href="#" style="display: flex; align-items: center; gap: 8px; opacity: 0.5; color: #131b24; font-family: 'IBM Plex Mono', monospace; font-size: 13px; transition: opacity 180ms ease;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 6 10-6"/></svg>
          dhruv.mundada04@gmail.com
        </a>
      </div>

    </div>

  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 46px; display: flex; align-items: stretch; background: #ffffff; border-top: 1px solid #e3ded4; font-family: 'IBM Plex Mono', monospace; font-size: 13px;">

    <div style="display: flex; align-items: center; padding: 0 20px; background: #0d6156; color: #ffffff; font-weight: 600; letter-spacing: 0.11em; font-size: 11px;">CLIENT</div>

    <div style="display: flex; align-items: center; gap: 26px; padding: 0 26px; flex-grow: 1;">
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
        <a href="#" style="display: flex; align-items: baseline; gap: 6px; opacity: 0.72;">
          <span style="color: #0d6156; font-size: 11px;">{{n.num}}</span>
          <span style="color: #131b24;">{{n.label}}</span>
        </a>
      </sc-for>
    </div>

    <div style="display: flex; align-items: center; gap: 20px; padding: 0 24px; font-size: 12px;">
      <span style="color: #8a94a0;">~/dhruv-mundada</span>
      <a href="#" style="display: flex; align-items: center; gap: 7px; color: #0d6156;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
        one-pager
      </a>
    </div>

  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      nav: ['services', 'work', 'writing', 'contact'].map((label, i) => ({ label, num: i + 1 }))
    };
  }
}
</script>
</body>
</html>
