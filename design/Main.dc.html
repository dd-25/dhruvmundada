<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500&family=Instrument+Serif:ital@0;1&display=swap">
  <style>
    body { margin: 0; }
    * { box-sizing: border-box; }
    a { text-decoration: none; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.22; } }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
    .soc:hover { opacity: 1 !important; }
    .navitem:hover { opacity: 1 !important; }
    .cta:hover { filter: brightness(1.08); }
  </style>
</helmet>

<div style="width: 1280px; height: 800px; position: relative; overflow: hidden; font-family: 'IBM Plex Sans', system-ui, sans-serif; background-color: {{t.ground}}; background-image: radial-gradient(circle, {{t.dot}} 1px, transparent 1px); background-size: 26px 26px; transition: background-color 300ms ease;">

  <!-- audience toggle -->
  <div style="position: absolute; top: 28px; right: 36px; display: flex; align-items: center; gap: 14px;">
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.09em; color: {{t.faint}};">VIEWING AS</span>
    <div style="display: flex; border: 1px solid {{t.border}}; border-radius: 3px; overflow: hidden;">
      <div onClick="{{pickClient}}" style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.05em; padding: 7px 16px; cursor: pointer; background: {{t.clientBg}}; color: {{t.clientFg}}; transition: all 220ms ease;">client</div>
      <div onClick="{{pickEngineer}}" style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.05em; padding: 7px 16px; cursor: pointer; background: {{t.engBg}}; color: {{t.engFg}}; transition: all 220ms ease;">engineer</div>
    </div>
  </div>

  <!-- centered block -->
  <div style="position: absolute; inset: 0 0 46px 0; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding: 0 0 0 136px;">

    <h1 style="margin: 0; font-family: {{t.nameFont}}; font-weight: {{t.nameWeight}}; font-size: {{t.nameSize}}; line-height: 1.02; letter-spacing: {{t.nameTrack}}; color: {{t.text}};">Dhruv Mundada</h1>

    <p style="margin: 24px 0 0 0; max-width: 32ch; font-size: 20px; line-height: 1.55; color: {{t.dim}}; text-wrap: pretty;">{{t.tagline}}</p>

    <!-- primary action changes with the lens -->
    <div style="display: flex; align-items: center; gap: 26px; margin-top: 44px;">

      <a class="cta" href="#" style="display: flex; align-items: center; gap: 9px; background: {{t.accent}}; color: {{t.accentInk}}; font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.02em; padding: 12px 20px; border-radius: 3px; transition: filter 160ms ease;">
        {{t.ctaLabel}}
        <span style="font-size: 14px;">{{t.ctaGlyph}}</span>
      </a>

      <div style="display: flex; align-items: center; gap: 20px;">
        <a class="soc" href="#" style="display: flex; opacity: 0.55; color: {{t.text}}; transition: opacity 180ms ease;" title="GitHub">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
        </a>
        <a class="soc" href="#" style="display: flex; opacity: 0.55; color: {{t.text}}; transition: opacity 180ms ease;" title="LinkedIn">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>
        </a>
        <a class="soc" href="#" style="display: flex; opacity: 0.55; color: {{t.text}}; transition: opacity 180ms ease;" title="X">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l7.5 9.8L3.4 21h2.2l6-6.6 5 6.6H21l-7.9-10.3L20.5 3h-2.2l-5.5 6L8.3 3z"/></svg>
        </a>
        <a class="soc" href="#" style="display: flex; align-items: center; gap: 8px; opacity: 0.55; color: {{t.text}}; font-family: 'IBM Plex Mono', monospace; font-size: 13px; transition: opacity 180ms ease;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 6 10-6"/></svg>
          dhruv.mundada04@gmail.com
        </a>
      </div>

    </div>

  </div>

  <!-- vim status bar -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 46px; display: flex; align-items: stretch; background: {{t.bar}}; border-top: 1px solid {{t.border}}; font-family: 'IBM Plex Mono', monospace; font-size: 13px; transition: background 300ms ease;">

    <div style="display: flex; align-items: center; padding: 0 20px; background: {{t.accent}}; color: {{t.accentInk}}; font-weight: 600; letter-spacing: 0.11em; font-size: 11px; transition: background 300ms ease;">{{t.label}}</div>

    <div style="display: flex; align-items: center; gap: 26px; padding: 0 26px; flex-grow: 1;">
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
        <a class="navitem" href="#" style="display: flex; align-items: baseline; gap: 6px; opacity: 0.7; transition: opacity 160ms ease;">
          <span style="color: {{t.accent}}; font-size: 11px;">{{n.num}}</span>
          <span style="color: {{t.text}};">{{n.label}}</span>
        </a>
      </sc-for>
    </div>

    <!-- real function in the prime corner, not a fake cursor readout -->
    <div style="display: flex; align-items: center; gap: 20px; padding: 0 24px; font-size: 12px;">
      <span style="color: {{t.faint}};">~/dhruv-mundada</span>
      <a href="#" style="display: flex; align-items: center; gap: 7px; color: {{t.accent}};">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
        résumé
      </a>
    </div>

  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":1280,"height":800},"lens":{"editor":"enum","options":["engineer","client"],"default":"engineer"}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { lens: null };
  }

  themes() {
    return {
      engineer: {
        ground: '#0a0b0e', bar: '#0e1014', dot: '#191c22',
        text: '#e8e8ec', dim: '#979aa4', faint: '#585b65',
        border: '#212329', accent: '#e5ab4a', accentInk: '#0a0b0e',
        label: 'ENGINEER',
        nameFont: "'IBM Plex Mono', monospace",
        nameWeight: '500', nameSize: '58px', nameTrack: '-0.022em',
        tagline: 'I build backend systems and lead the people who ship them.',
        ctaLabel: 'résumé', ctaGlyph: '↓'
      },
      client: {
        ground: '#faf8f4', bar: '#ffffff', dot: '#e7e2d8',
        text: '#131b24', dim: '#4e5b68', faint: '#8a94a0',
        border: '#e3ded4', accent: '#0d6156', accentInk: '#ffffff',
        label: 'CLIENT',
        nameFont: "'Instrument Serif', Georgia, serif",
        nameWeight: '400', nameSize: '68px', nameTrack: '-0.01em',
        tagline: 'I take products from an idea to something people pay for.',
        ctaLabel: 'book a call', ctaGlyph: '→'
      }
    };
  }

  renderVals() {
    const lens = this.state.lens ?? this.props.lens ?? 'engineer';
    const t = { ...this.themes()[lens] };

    const on = lens === 'client';
    t.clientBg = on ? t.accent : 'transparent';
    t.clientFg = on ? t.accentInk : t.faint;
    t.engBg = on ? 'transparent' : t.accent;
    t.engFg = on ? t.faint : t.accentInk;

    const items = on
      ? ['services', 'work', 'writing', 'contact']
      : ['experience', 'projects', 'writing', 'contact'];

    return {
      t,
      nav: items.map((label, i) => ({ label, num: i + 1 })),
      pickClient: () => this.setState({ lens: 'client' }),
      pickEngineer: () => this.setState({ lens: 'engineer' })
    };
  }
}
</script>
</body>
</html>
